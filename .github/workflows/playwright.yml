name: PlaywrightGreenKartTest

on:
  # Daily run at 08:00 AM IST (02:30 UTC)
  schedule:
    - cron: '30 2 * * *'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Playwright tag to run (e.g. @greenkart, @smoke, @regression)'
        required: true
        default: '@greenkart'

jobs:
  greencart-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      SUITE_NAME: PlaywrightGreenKartTest
      TAG: ${{ github.event.inputs.tag || '@greenkart' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run GreenKart Playwright Tests by Tag
        run: |
          echo "Running Suite: $SUITE_NAME"
          echo "Running Playwright Tag: $TAG"
          npx playwright test --grep "$TAG"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SUITE_NAME }}-Report
          path: playwright-report/
          retention-days: 30
